function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))} function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function keyFromPin(pin,salt){const km=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function freshGoals(){return seed.map(x=>({id:crypto.randomUUID(),category:x[0],title:x[1],repeat:x[2]||'none',lastDone:'',note:'',status:'todo',doneDate:'',achievementMemo:'',photo:''}))}
function migrate(payload){const list=Array.isArray(payload)?payload:(payload?.goals||[]);if(payload?.categories?.length)categories.splice(0,categories.length,...payload.categories);return list.map(g=>({...g,repeat:g.repeat||'none',lastDone:g.lastDone||'',status:g.status||(g.done?'done':'todo'),doneDate:g.doneDate||'',achievementMemo:g.achievementMemo||'',photo:''}))}
async function save(){if(!sessionKey)return;const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},sessionKey,enc.encode(JSON.stringify({goals,categories})));localStorage.setItem(STORE,JSON.stringify({iv:b64(iv),ct:b64(ct)}))}

async function unlock(){const pin=document.getElementById('pin').value.trim(),err=document.getElementById('err');err.textContent='';if(pin.length<6){err.textContent='PINは6桁以上にしてください';return}let salt=localStorage.getItem(SALT);if(!salt){salt=b64(crypto.getRandomValues(new Uint8Array(16)));localStorage.setItem(SALT,salt);sessionKey=await keyFromPin(pin,unb64(salt));goals=freshGoals();await save()}else{try{sessionKey=await keyFromPin(pin,unb64(salt));const raw=localStorage.getItem(STORE);if(raw){const o=JSON.parse(raw);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},sessionKey,unb64(o.ct));goals=migrate(JSON.parse(dec.decode(pt)));await save()}else{goals=freshGoals();await save()}}catch(e){sessionKey=null;err.textContent='PINが違います';return}}document.getElementById('lock').style.display='none';document.getElementById('pin').value='';render()}
function lock(){sessionKey=null;goals=[];document.getElementById('lockTitle').textContent='ロック中';document.getElementById('lockMsg').textContent='PINを入力してください。';document.getElementById('lock').style.display='flex';document.getElementById('pin').focus()}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function statusIcon(s){return s==='done'?'✓':s==='doing'?'●':'○'} function statusText(s){return s==='done'?'達成！':s==='doing'?'挑戦中':'未着手'}
function repeatLabel(r){return r==='weekly'?'🔄毎週':r==='monthly'?'🔄毎月':r==='yearly'?'🔄毎年':''}

function isRoutineDone(g){
  if(!g.lastDone) return false;
  const last=new Date(g.lastDone), now=new Date();
  if(g.repeat==='weekly'){
    const diff=(now-last)/(1000*60*60*24);
    return diff < 7;
  }
  if(g.repeat==='monthly'){
    return last.getFullYear()===now.getFullYear() && last.getMonth()===now.getMonth();
  }
  if(g.repeat==='yearly'){
    return last.getFullYear()===now.getFullYear();
  }
  return false;
}

async function toggleRoutine(id){
  const g=goals.find(x=>x.id===id); if(!g) return;
  if(isRoutineDone(g)){
    g.lastDone='';
  } else {
    g.lastDone=new Date().toISOString().slice(0,10);
  }
  await save(); render();
}

function renderFilters(){const el=document.getElementById('categoryFilters');el.innerHTML=['すべて',...categories,'挑戦中','達成したこと'].map(c=>`<button class="${c===active?'active':''}" data-c="${c}">${c}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.c;render()})}

function render(){
  renderFilters();
  const q=document.getElementById('search').value.trim().toLowerCase();
  
  // Routine Area
  const routineArea=document.getElementById('routineArea');
  const routines=goals.filter(g=>g.repeat && g.repeat!=='none');
  if(routines.length && active==='すべて' && !q){
    routineArea.innerHTML=`<div class="routine-card"><div class="routine-head"><span>🔄 定期習慣・ルーティンタスク</span><span style="font-size:11px;color:var(--muted)">毎週・毎月・毎年の習慣</span></div><div class="routine-grid">`+
    routines.map(g=>{
      const done=isRoutineDone(g);
      return `<div class="routine-item"><div><div class="routine-title">${esc(g.title)} <span class="repeat-badge">${repeatLabel(g.repeat)}</span></div><div class="routine-next">${done?'✅ 今期分クリア！':(g.lastDone?'前回の実施: '+g.lastDone:'未設定')}</div></div><button class="routine-btn ${done?'done':''}" onclick="toggleRoutine('${g.id}')">${done?'完了済み':'✅ 今期分を完了'}</button></div>`
    }).join('')+`</div></div>`;
  } else {
    routineArea.innerHTML='';
  }

  let list=goals.filter(g=>{const af=active==='50歳の1年目'?false:(active==='すべて'||(active==='達成したこと'?g.status==='done':active==='挑戦中'?g.status==='doing':g.category===active));return af&&(!q||g.title.toLowerCase().includes(q)||(g.note||'').toLowerCase().includes(q)||(g.achievementMemo||'').toLowerCase().includes(q))});
  const done=goals.filter(g=>g.status==='done').length,doing=goals.filter(g=>g.status==='doing').length,todo=goals.filter(g=>g.status==='todo').length,total=goals.length,p=total?Math.round(done/total*100):0;
  doneCount.textContent=done;doingCount.textContent=doing;todoCount.textContent=todo;totalCount.textContent=total;pct.textContent=p+'%';
  
  const root=document.getElementById('list');
  const top=document.getElementById('top10');
  const priorities=[
    ['🏃','10kmラン','10km大会完走、できれば60分以内'],['💪','身体作り','懸垂5回以上＋見た目で分かる身体の変化'],['🍺','飲酒改善','飲まない日を普通に作れる'],['🧘','マインドフルネス','週1回から習慣化'],['👨‍👩‍👧‍👧','娘の投資教育','長女・次女の投資口座をスタート'],['❤️','夫婦','ウォーキング・外食・小旅行を習慣化'],['💰','60歳資金計画','INPS・TFR・投資を全部まとめる'],['✍️','発信','note開始→最低52記事'],['🤖','AI','実際に使えるものを1つ完成させる'],['💶','副収入','自分の力で本業以外から最初の€1を稼ぐ']
  ];
  const norm=s=>(s||'').replace(/[\s ]/g,'').toLowerCase();
  top.className='top10';
  top.style.display=active==='50歳の1年目'?'block':'none';
  top.innerHTML='<div class="top10-head"><strong>🏆 最重要TOP10</strong><span class="top10-badge">50歳の1年目</span></div><div class="top10-grid">'+priorities.map((x,i)=>{
   const g=goals.find(y=>norm(y.title).includes(norm(x[1]))||norm(x[1]).includes(norm(y.title)));
   const st=g?g.status:'todo'; const stxt=st==='done'?'✅ 達成！':st==='doing'?'🟡 挑戦中':'⬜ 未着手';
   return `<div class="priority"><div><span class="rank">${i+1}</span><span class="ptitle">${x[0]} ${x[1]}</span></div><div class="pgoal">${x[2]}</div><div class="pstatus">${stxt}</div></div>`
  }).join('')+'</div>';

  if(!list.length){root.innerHTML=active==='50歳の1年目'?'':'<div class="empty">該当する目標はありません</div>';return}
  const order=[['done','✅ 達成したもの'],['doing','🟡 着手・挑戦中'],['todo','⬜ まだ何も出来ていないもの']];
  root.innerHTML='';
  order.forEach(([status,label])=>{
    const arr=list.filter(g=>g.status===status);
    if(!arr.length)return;
    const sec=document.createElement('div');sec.className='section status-section';
    sec.innerHTML=`<h2>${label} <span style="font-size:11px;color:var(--muted)">${arr.length}件</span></h2>`;
    arr.forEach(g=>{
      const d=document.createElement('div');d.className='goal '+g.status;
      d.innerHTML=`<div class="row"><div class="status-dot">${statusIcon(g.status)}</div><div style="flex:1"><div class="title">${esc(g.title)}${g.repeat&&g.repeat!=='none'?`<span class="repeat-badge">${repeatLabel(g.repeat)}</span>`:''}</div><div class="meta">${esc(g.category)} ・ ${statusText(g.status)}</div>${g.status==='done'?`<div class="done-badge">🏆 達成した！ ${g.doneDate?esc(g.doneDate):''}</div>`:''}${g.note?`<div class="meta">目標メモ：${esc(g.note)}</div>`:''}${g.status==='done'&&g.achievementMemo?`<div class="meta">達成メモ：${esc(g.achievementMemo)}</div>`:''}${g.status==='done'&&g.photo?`<img class="photo" src="${g.photo}" alt="達成写真">`:''}<div class="statusline"><button class="todo ${g.status==='todo'?'on':''}">⬜ 未着手</button><button class="doing ${g.status==='doing'?'on':''}">🟡 挑戦中</button><button class="done ${g.status==='done'?'on':''}">✅ 達成！</button></div><div class="actions"><button class="edit">編集</button><button class="del danger">削除</button></div></div></div>`;
      d.querySelector('.todo').onclick=()=>setStatus(g.id,'todo');
      d.querySelector('.doing').onclick=()=>setStatus(g.id,'doing');
      d.querySelector('.done').onclick=()=>openAchievement(g.id);
      d.querySelector('.edit').onclick=()=>openEdit(g.id);
      d.querySelector('.del').onclick=async()=>{if(confirm('この目標を削除しますか？')){goals=goals.filter(x=>x.id!==g.id);await save();render()}};
      sec.appendChild(d)
    });
    root.appendChild(sec)
  })
}

async function setStatus(id,status){const g=goals.find(x=>x.id===id);g.status=status;if(status!=='done'){g.doneDate='';g.achievementMemo='';g.photo=''}await save();render()}
function refreshCategorySelects(){const currentGoal=goalCategory?.value||'';const opts=categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(goalCategory){goalCategory.innerHTML=opts;goalCategory.value=categories.includes(currentGoal)?currentGoal:(categories[0]||'')}}

function openEdit(id){const g=id?goals.find(x=>x.id===id):null;refreshCategorySelects();dialogTitle.textContent=g?'目標を編集':'目標を追加';goalId.value=g?.id||'';goalTitle.value=g?.title||'';goalCategory.value=(g&&categories.includes(g.category))?g.category:(categories[0]||'');goalRepeat.value=g?.repeat||'none';goalNote.value=g?.note||'';goalDialog.showModal()}
function openAchievement(id){const g=goals.find(x=>x.id===id);achievementId.value=id;achievementDate.value=g.doneDate||new Date().toISOString().slice(0,10);achievementMemo.value=g.achievementMemo||'';pendingPhoto=g.photo||'';photoPreview.src=pendingPhoto;photoPreview.style.display=pendingPhoto?'block':'none';achievementPhoto.value='';achievementDialog.showModal()}

function exportCSV(){
  let csv="\uFEFFステータス,ジャンル,目標タイトル,定期設定,目標メモ,達成日,達成メモ\n";
  goals.forEach(g=>{
    const st=g.status==='done'?'達成':g.status==='doing'?'挑戦中':'未着手';
    const rep=repeatLabel(g.repeat);
    csv += `"${st}","${g.category||''}","${(g.title||'').replace(/"/g,'""')}","${rep}","${(g.note||'').replace(/"/g,'""')}","${g.doneDate||''}","${(g.achievementMemo||'').replace(/"/g,'""')}"\n`;
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`50_60_PROJECT_目標リスト_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

async function imageToDataURL(file){if(!file)return pendingPhoto;const img=await createImageBitmap(file);const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.75)}
achievementPhoto.onchange=async()=>{const f=achievementPhoto.files[0];if(!f)return;pendingPhoto=await imageToDataURL(f);photoPreview.src=pendingPhoto;photoPreview.style.display='block'};
achievementCancel.onclick=()=>achievementDialog.close();achievementForm.addEventListener('submit',async e=>{e.preventDefault();const g=goals.find(x=>x.id===achievementId.value);if(!g)return;g.status='done';g.doneDate=achievementDate.value||new Date().toISOString().slice(0,10);g.achievementMemo=achievementMemo.value.trim();g.photo=pendingPhoto||'';await save();achievementDialog.close();render()});

refreshCategorySelects();
goalForm.addEventListener('submit',async e=>{e.preventDefault();const id=goalId.value,title=goalTitle.value.trim(),category=goalCategory.value,repeat=goalRepeat.value,note=goalNote.value.trim();if(!title)return;if(id){const g=goals.find(x=>x.id===id);Object.assign(g,{title,category,repeat,note})}else goals.push({id:crypto.randomUUID(),title,category,repeat,lastDone:'',note,status:'todo',doneDate:'',achievementMemo:'',photo:''});await save();goalDialog.close();render()});
goalCancel.onclick=()=>goalDialog.close();categoryBtn.onclick=()=>document.getElementById('categoryDialog').showModal();addCategoryBtn.onclick=async()=>{const input=document.getElementById('newCategory'),name=input.value.trim();if(!name||categories.includes(name))return;categories.push(name);input.value='';refreshCategorySelects();await save();render();document.getElementById('categoryDialog').close()};categoryClose.onclick=()=>document.getElementById('categoryDialog').close();
addBtn.onclick=()=>openEdit();fab.onclick=()=>openEdit();search.oninput=render;unlockBtn.onclick=unlock;pin.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});lockBtn.onclick=lock;exportBtn.onclick=exportCSV;

if(!localStorage.getItem(SALT)){lockTitle.textContent='PINを設定';lockMsg.textContent='初回のみ、自分専用のPINを設定してください。6桁以上をおすすめします。'}else{lockTitle.textContent='ロック中';lockMsg.textContent='PINを入力してください。'}

function updateFixedLayout(){
  const header=document.querySelector('header');const fixed=document.querySelector('.fixed');const scroll=document.querySelector('.scroll');if(!header||!fixed||!scroll)return;
  const hh=Math.ceil(header.getBoundingClientRect().height);fixed.style.top=hh+'px';
  const fh=Math.ceil(fixed.getBoundingClientRect().height);scroll.style.top=(hh+fh)+'px';
}
window.addEventListener('resize', updateFixedLayout);
setTimeout(updateFixedLayout,100);
</script></body></html>
