<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}

.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}

.topbtn{border:1px solid var(--line);background:white;border-radius:999px;padding:4px 9px;font-weight:700;font-size:11px;cursor:pointer}

.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center}
.big{font-size:15px;font-weight:800;line-height:1.2}
.label,.small{font-size:10px;color:var(--muted)}
.progress{height:4px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:4px}
.bar{height:100%;background:#111827;width:0}

.controls{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.controls::-webkit-scrollbar{display:none}
.controls button,.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 9px;white-space:nowrap;font-weight:700;font-size:11px;cursor:pointer}
.controls button.active{background:#111827;color:white}
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:2px}
.toolbar input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:white;font-size:13px}
.manage{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);padding:0 10px;font-weight:800;font-size:11px;cursor:pointer}
.add{border:0;border-radius:9px;background:#111827;color:#fff;padding:0 12px;font-weight:800;font-size:11px;cursor:pointer}

.section{margin-top:6px}
.status-section{margin-bottom:14px}
.status-section>h2{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 2px 4px;border-bottom:1px solid var(--line);font-size:14px;margin:0 0 6px}
.section h2{font-size:15px;margin:8px 2px 6px}

.goal.todo .status-dot{color:var(--idle)}

.statusline button.on.doing{background:#fef3c7;border-color:#f59e0b}
.statusline button.on.done{background:#dcfce7;border-color:#22c55e;color:#166534}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

.photo{margin-top:6px;width:100%;max-height:200px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:13px}
.fab{position:fixed;right:16px;bottom:16px;border:0;border-radius:50%;width:52px;height:52px;background:#111827;color:#fff;font-size:26px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20;cursor:pointer}

/* ダイアログ modal */

.danger{color:#b91c1c}

.lockcard button{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:800;cursor:pointer;font-size:14px}

const STORE='fifty_sixty_encrypted_v1', SALT='fifty_sixty_salt_v1'; let goals=[],active='すべて',sessionKey=null,pendingPhoto=''; const enc=new TextEncoder(),dec=new TextDecoder();
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))} function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function keyFromPin(pin,salt){const km=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function freshGoals(){return seed.map(x=>({id:crypto.randomUUID(),category:x[0],title:x[1],note:'',status:'todo',doneDate:'',achievementMemo:'',photo:''}))}
function migrate(payload){const list=Array.isArray(payload)?payload:(payload?.goals||[]);if(payload?.categories?.length)categories.splice(0,categories.length,...payload.categories);return list.map(g=>({...g,status:g.status||(g.done?'done':'todo'),doneDate:g.doneDate||'',achievementMemo:g.achievementMemo||'',photo:g.photo||''}))}
async function save(){if(!sessionKey)return;const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},sessionKey,enc.encode(JSON.stringify({goals,categories})));localStorage.setItem(STORE,JSON.stringify({iv:b64(iv),ct:b64(ct)}))}
async function unlock(){const pin=document.getElementById('pin').value.trim(),err=document.getElementById('err');err.textContent='';if(pin.length<6){err.textContent='PINは6桁以上にしてください';return}let salt=localStorage.getItem(SALT);if(!salt){salt=b64(crypto.getRandomValues(new Uint8Array(16)));localStorage.setItem(SALT,salt);sessionKey=await keyFromPin(pin,unb64(salt));goals=freshGoals();await save()}else{try{sessionKey=await keyFromPin(pin,unb64(salt));const raw=localStorage.getItem(STORE);if(raw){const o=JSON.parse(raw);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},sessionKey,unb64(o.ct));goals=migrate(JSON.parse(dec.decode(pt)));await save()}else{goals=freshGoals();await save()}}catch(e){sessionKey=null;err.textContent='PINが違います';return}}document.getElementById('lock').style.display='none';document.getElementById('pin').value='';render();updateFixedLayout();}
function lock(){sessionKey=null;goals=[];document.getElementById('lockTitle').textContent='ロック中';document.getElementById('lockMsg').textContent='PINを入力してください。';document.getElementById('lock').style.display='grid';document.getElementById('pin').focus()}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function statusIcon(s){return s==='done'?'✓':s==='doing'?'●':'○'} function statusText(s){return s==='done'?'達成！':s==='doing'?'挑戦中':'未着手'}
function renderFilters(){const el=document.getElementById('categoryFilters');el.innerHTML=['すべて',...categories,'挑戦中','達成したこと'].map(c=>`<button class="${c===active?'active':''}" data-c="${c}">${c}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.c;render()})}

function render(){
  renderFilters();
  const q=document.getElementById('search').value.trim().toLowerCase();
  let list=goals.filter(g=>{
    const af=active==='50歳の1年目'?false:(active==='すべて'||(active==='達成したこと'?g.status==='done':active==='挑戦中'?g.status==='doing':g.category===active));
    return af&&(!q||g.title.toLowerCase().includes(q)||(g.note||'').toLowerCase().includes(q)||(g.achievementMemo||'').toLowerCase().includes(q))
  });
  const done=goals.filter(g=>g.status==='done').length,doing=goals.filter(g=>g.status==='doing').length,todo=goals.filter(g=>g.status==='todo').length,total=goals.length,p=total?Math.round(done/total*100):0;
  doneCount.textContent=done;doingCount.textContent=doing;todoCount.textContent=todo;totalCount.textContent=total;pct.textContent=p+'%';bar.style.width=p+'%';
  
  const root=document.getElementById('list');
  const top=document.getElementById('top10');
  const priorities=[
    ['🏃','10kmラン','10km大会完走、できれば60分以内'],
    ['💪','身体作り','懸垂5回以上＋見た目で分かる身体の変化'],
    ['🍺','飲酒改善','飲まない日を普通に作れる'],
    ['🧘','マインドフルネス','10分を習慣化'],
    ['👨‍👩‍👧‍👧','娘の投資教育','投資口座＋少額投資開始'],
    ['❤️','夫婦','ウォーキング・外食・小旅行を習慣化'],
    ['💰','60歳資金計画','INPS・TFR・投資を全部まとめる'],
    ['✍️','発信','note開始→最低52記事'],
    ['🤖','AI','実際に使えるものを1つ完成させる'],
    ['💶','副収入','自分の力で本業以外から最初の€1を稼ぐ']
  ];
  const norm=s=>(s||'').replace(/[\s　]/g,'').toLowerCase();
  top.className='top10';
  top.style.display=active==='50歳の1年目'?'block':'none';
  top.innerHTML='<div class="top10-head"><strong>🏆 最重要TOP10</strong><span class="top10-badge">50歳の1年目</span></div><div class="top10-grid">'+priorities.map((x,i)=>{
    const g=goals.find(y=>norm(y.title).includes(norm(x[1]))||norm(x[1]).includes(norm(y.title)));
    const st=g?g.status:'todo'; const stxt=st==='done'?'✅ 達成！':st==='doing'?'🟡 挑戦中':'⬜ 未着手';
    return `<div class="priority"><div><span class="rank">${i+1}</span><span class="ptitle">${x[0]} ${x[1]}</span></div><div class="pgoal">${x[2]}</div><div class="pstatus">${stxt}</div></div>`
  }).join('')+'</div>';

  if(!list.length){root.innerHTML=active==='50歳の1年目'?'':'<div class="empty">該当する目標はありません</div>';return}
  const order=[['done','✅ 達成したもの'],['doing','🟡 着手・挑戦中'],['todo','⬜ まだ何も出来ていないもの']];
  root.innerHTML='';
  order.forEach(([status,label])=>{
    const arr=list.filter(g=>g.status===status);
    if(!arr.length)return;
    const sec=document.createElement('div');sec.className='section status-section';
    sec.innerHTML=`<h2>${label} <span class="small">${arr.length}件</span></h2>`;
    arr.forEach(g=>{
      const d=document.createElement('div');d.className='goal '+g.status;
      d.innerHTML=`<div class="row"><div class="status-dot">${statusIcon(g.status)}</div><div style="flex:1"><div class="title">${esc(g.title)}</div><div class="meta">${esc(g.category)} ・ ${statusText(g.status)}</div>${g.status==='done'?`<div class="done-badge">🏆 達成！ ${g.doneDate?esc(g.doneDate):''}</div>`:''}${g.note?`<div class="meta">目標メモ：${esc(g.note)}</div>`:''}${g.status==='done'&&g.achievementMemo?`<div class="meta">達成メモ：${esc(g.achievementMemo)}</div>`:''}${g.status==='done'&&g.photo?`<img class="photo" src="${g.photo}" alt="達成写真">`:''}<div class="statusline"><button class="todo ${g.status==='todo'?'on':''}">⬜ 未着手</button><button class="doing ${g.status==='doing'?'on':''}">🟡 挑戦中</button><button class="done ${g.status==='done'?'on':''}">✅ 達成！</button></div><div class="actions"><button class="edit">編集</button><button class="del danger">削除</button></div></div></div>`;
      d.querySelector('.todo').onclick=()=>setStatus(g.id,'todo');
      d.querySelector('.doing').onclick=()=>setStatus(g.id,'doing');
      d.querySelector('.done').onclick=()=>openAchievement(g.id);
      d.querySelector('.edit').onclick=()=>openEdit(g.id);
      d.querySelector('.del').onclick=async()=>{if(confirm('この目標を削除しますか？')){goals=goals.filter(x=>x.id!==g.id);await save();render()}};
      sec.appendChild(d)
    });
    root.appendChild(sec)
  });
}

async function setStatus(id,status){const g=goals.find(x=>x.id===id);g.status=status;if(status!=='done'){g.doneDate='';g.achievementMemo='';g.photo=''}await save();render()}
function refreshCategorySelects(){const currentGoal=goalCategory?.value||'';const currentNext=nextGoalCategory?.value||'';const opts=categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(goalCategory){goalCategory.innerHTML=opts;goalCategory.value=categories.includes(currentGoal)?currentGoal:(categories[0]||'')}if(nextGoalCategory){nextGoalCategory.innerHTML=opts;nextGoalCategory.value=categories.includes(currentNext)?currentNext:(categories[0]||'')}}
function renderCategoryManager(){const el=document.getElementById('categoryList');el.innerHTML=categories.map((c,i)=>{const protectedCat=c==='50歳の1年目';const count=goals.filter(g=>g.category===c).length;return `<div class="category-item"><div class="category-name">${esc(c)}<div class="category-note">${count}件${protectedCat?' ・ 最重要TOP10用':''}</div></div><button type="button" class="cat-edit" data-i="${i}" ${protectedCat?'disabled':''}>編集</button><button type="button" class="cat-del danger" data-i="${i}" ${protectedCat?'disabled':''}>削除</button></div>`}).join('');el.querySelectorAll('.cat-edit').forEach(b=>b.onclick=()=>editCategory(Number(b.dataset.i)));el.querySelectorAll('.cat-del').forEach(b=>b.onclick=()=>deleteCategory(Number(b.dataset.i)))}
async function editCategory(i){const old=categories[i];if(!old||old==='50歳の1年目')return;const next=prompt('カテゴリー名を変更してください',old);if(next===null)return;const name=next.trim();if(!name||name===old)return;if(['すべて','挑戦中','達成したこと','50歳の1年目'].includes(name)){alert('この名前は使用できません。');return}if(categories.includes(name)){alert('同名のカテゴリーがあります。');return}categories[i]=name;goals.forEach(g=>{if(g.category===old)g.category=name});if(active===old)active=name;refreshCategorySelects();await save();render();renderCategoryManager()}
async function deleteCategory(i){const name=categories[i];if(!name||name==='50歳の1年目')return;const count=goals.filter(g=>g.category===name).length;if(count){const choices=categories.filter((c,j)=>j!==i&&c!=='50歳の1年目');const target=prompt(`${count}件の目標が登録されています。\n移動先カテゴリー名を入力してください。\n候補：${choices.join(' / ')}`,choices[0]||'');if(target===null)return;const dest=target.trim();if(!dest||!categories.includes(dest)||dest===name||dest==='50歳の1年目'){alert('有効な移動先を指定してください。');return}goals.forEach(g=>{if(g.category===name)g.category=dest});}if(!confirm(`「${name}」を削除しますか？`))return;categories.splice(i,1);if(active===name)active='すべて';refreshCategorySelects();await save();render();renderCategoryManager()}
async function addCategory(){const input=document.getElementById('newCategory');const name=input.value.trim();if(!name)return;if(['すべて','挑戦中','達成したこと','50歳の1年目'].includes(name)){alert('この名前は使用できません。');return}if(categories.includes(name)){alert('同名のカテゴリーがあります。');return}categories.push(name);input.value='';refreshCategorySelects();await save();render();renderCategoryManager();input.focus()}

function openEdit(id){const g=id?goals.find(x=>x.id===id):null;refreshCategorySelects();dialogTitle.textContent=g?'目標を編集':'目標を追加';goalId.value=g?.id||'';goalTitle.value=g?.title||'';goalCategory.value=(g&&categories.includes(g.category))?g.category:(categories[0]||'');goalNote.value=g?.note||'';goalDialog.showModal()}
function openAchievement(id){const g=goals.find(x=>x.id===id);achievementId.value=id;achievementDate.value=g.doneDate||new Date().toISOString().slice(0,10);achievementMemo.value=g.achievementMemo||'';pendingPhoto=g.photo||'';photoPreview.src=pendingPhoto;photoPreview.style.display=pendingPhoto?'block':'none';achievementPhoto.value='';addNextGoal.checked=g.status!=='done';nextGoalFields.style.display=addNextGoal.checked?'block':'none';nextGoalTitle.value='';nextGoalCategory.value=g.category;achievementDialog.showModal()}
async function imageToDataURL(file){if(!file)return pendingPhoto;const img=await createImageBitmap(file);const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.75)}

// バックアップ・ダウンロード・復元機能
function exportBackup(){
  const data=localStorage.getItem(STORE);
  const salt=localStorage.getItem(SALT);
  if(!data){alert('保存されているデータがありません。');return}
  const blob=new Blob([JSON.stringify({data,salt})],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`50_60_PROJECT_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(){
  const fileInput=document.getElementById('importFile');
  const file=fileInput.files[0];
  if(!file){alert('ファイルを選択してください。');return}
  const reader=new FileReader();
  reader.onload=async(e)=>{
    try{
      const json=JSON.parse(e.target.result);
      if(json.data && json.salt){
        localStorage.setItem(STORE,json.data);
        localStorage.setItem(SALT,json.salt);
        alert('バックアップデータを読み込みました。アプリを再起動（ロック解錠）します。');
        backupDialog.close();
        lock();
      }else{
        alert('無効なバックアップファイルです。');
      }
    }catch(err){
      alert('ファイルの読み込みに失敗しました。');
    }
  };
  reader.readAsText(file);
}

achievementPhoto.onchange=async()=>{const f=achievementPhoto.files[0];if(!f)return;pendingPhoto=await imageToDataURL(f);photoPreview.src=pendingPhoto;photoPreview.style.display='block'};
achievementCancel.onclick=()=>achievementDialog.close();achievementForm.addEventListener('submit',async e=>{e.preventDefault();const g=goals.find(x=>x.id===achievementId.value);if(!g)return;g.status='done';g.doneDate=achievementDate.value||new Date().toISOString().slice(0,10);g.achievementMemo=achievementMemo.value.trim();g.photo=pendingPhoto||'';const nt=nextGoalTitle.value.trim();if(addNextGoal.checked&&nt){goals.push({id:crypto.randomUUID(),title:nt,category:nextGoalCategory.value||g.category,note:'「'+g.title+'」達成後に追加',status:'todo',doneDate:'',achievementMemo:'',photo:'',parentGoalId:g.id})}await save();achievementDialog.close();render()});
refreshCategorySelects();addNextGoal.onchange=()=>nextGoalFields.style.display=addNextGoal.checked?'block':'none';goalForm.addEventListener('submit',async e=>{e.preventDefault();const id=goalId.value,title=goalTitle.value.trim(),category=goalCategory.value,note=goalNote.value.trim();if(!title)return;if(id){const g=goals.find(x=>x.id===id);Object.assign(g,{title,category,note})}else goals.push({id:crypto.randomUUID(),title,category,note,status:'todo',doneDate:'',achievementMemo:'',photo:''});await save();goalDialog.close();render()});goalCancel.onclick=()=>goalDialog.close();categoryBtn.onclick=()=>openCategoryManager();addCategoryBtn.onclick=addCategory;categoryClose.onclick=()=>document.getElementById('categoryDialog').close();newCategory.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addCategory()}});addBtn.onclick=()=>openEdit();fab.onclick=()=>openEdit();search.oninput=render;unlockBtn.onclick=unlock;pin.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});lockBtn.onclick=lock;

backupBtn.onclick=()=>document.getElementById('backupDialog').showModal();
backupClose.onclick=()=>document.getElementById('backupDialog').close();
exportBtn.onclick=exportBackup;
importBtn.onclick=importBackup;

if(!localStorage.getItem(SALT)){lockTitle.textContent='PINを設定';lockMsg.textContent='初回のみ、自分専用のPINを設定してください。6桁以上をおすすめします。'}else{lockTitle.textContent='ロック中';lockMsg.textContent='PINを入力してください。'}

function updateFixedLayout(){
  const header=document.querySelector('header');
  const fixed=document.querySelector('.fixed');
  const scroll=document.querySelector('.scroll');
  if(!header||!fixed||!scroll) return;
  const hh=Math.ceil(header.getBoundingClientRect().height);
  header.style.top='0px';
  fixed.style.top=hh+'px';
  const fh=Math.ceil(fixed.getBoundingClientRect().height);
  scroll.style.top=(hh+fh)+'px';
}
window.addEventListener('resize', updateFixedLayout);
window.addEventListener('orientationchange', ()=>setTimeout(updateFixedLayout,100));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(updateFixedLayout);
setTimeout(updateFixedLayout,0);
setTimeout(updateFixedLayout,250);
</script>
